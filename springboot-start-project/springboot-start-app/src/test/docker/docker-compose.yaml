version: '3.8'

services:

    infinispan:
        container_name: infinispan
        image: quay.io/infinispan/server:14.0
        restart: always
        depends_on:
            - keycloak
        ports:
            - "11222:11222"
        environment:
            - USER=admin
            - PASS=password
        volumes:
            - infinispan_data:/user-config

    # http://localhost:8180/iam - same path layout as behind Nginx (https://example.com/iam), see keycloak.md.
    # Configure realm, clients and roles: src/main/keycloak/keycloak-setup.sh
    keycloak:
        container_name: keycloak
        image: quay.io/keycloak/keycloak:26.7.1
        command: start-dev
        restart: always
        ports:
            - "8180:8080"
        environment:
            - KC_BOOTSTRAP_ADMIN_USERNAME=admin
            - KC_BOOTSTRAP_ADMIN_PASSWORD=password
            - KC_HTTP_RELATIVE_PATH=/iam
        volumes:
            - keycloak_data:/opt/keycloak/data

# TODO : Set up Infinispan to use volumes to save data for next startup.
volumes:
    infinispan_data:
    keycloak_data:

networks:
    keycloak_network:
        driver: bridge
