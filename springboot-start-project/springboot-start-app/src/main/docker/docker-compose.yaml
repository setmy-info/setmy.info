services:
    microservice-postgres:
        # PostgreSQL 18 with PostGIS 3.6: the official postgres image has no PostGIS
        image: postgis/postgis:18-3.6
        container_name: microservice-postgres
        restart: always
        # postgres is the superuser of the image only: the databases and users come from the *-init.sql files,
        # generated by smi-postgresql-create-db-sql (command in their first line), run once on an empty volume
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: g6p8
        volumes:
            - postgres-data:/var/lib/postgresql
            - ./postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
            - ./keycloak-init.sql:/docker-entrypoint-initdb.d/keycloak-init.sql:ro
            - ./postgres-postgis.sql:/docker-entrypoint-initdb.d/postgres-postgis.sql:ro
        ports:
            - '5433:5432'
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres -d springboot_start_app_local" ]
            interval: 5s
            timeout: 5s
            retries: 10

    microservice-infinispan:
        image: quay.io/infinispan/server
        container_name: microservice-infinispan
        restart: always
        environment:
            USER: microservice
            PASS: g6p8
        ports:
            - "11222:11222"

    # http://localhost:8180/iam, admin/password. Realms, clients and users are stored in the database keycloak_local
    # of microservice-postgres, so they stay over restarts and `down`; `down -v` removes them. On an empty database
    # every realm JSON of ./keycloak is imported at the start (an existing realm is left as it is). See keycloak.md.
    microservice-keycloak:
        image: quay.io/keycloak/keycloak:26.8.2
        container_name: microservice-keycloak
        restart: always
        command: start-dev --import-realm
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: password
            KC_HTTP_RELATIVE_PATH: /iam
            # The URL of the browser: tokens carry iss http://localhost:8180/iam/realms/..., also when the app
            # container talks to Keycloak as microservice-keycloak:8080
            KC_HOSTNAME: http://localhost:8180/iam
            KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://microservice-postgres:5432/keycloak_local
            # The owner (Liquibase) user: Keycloak creates and migrates its own tables
            KC_DB_USERNAME: localkeycloakliquibase
            KC_DB_PASSWORD: g6p8
        volumes:
            - ./keycloak:/opt/keycloak/data/import:ro
        depends_on:
            microservice-postgres:
                condition: service_healthy
        ports:
            - "8180:8080"

    springboot-start-app:
        image: setmyinfo/springboot-start-app:latest
        container_name: springboot-start-app
        environment:
            MICROSERVICE_PROFILES: local,compose
            INFINISPAN_SERVER_LIST: microservice-infinispan:11222
            INFINISPAN_AUTH_USERNAME: microservice
            INFINISPAN_AUTH_PASSWORD: g6p8
            # Keycloak: issuer and the rest from application.yaml (http://localhost:8180/iam, realm example), only the
            # signing keys are fetched inside the compose network
            SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://microservice-keycloak:8080/iam/realms/example/protocol/openid-connect/certs
        depends_on:
            microservice-postgres:
                condition: service_healthy
            microservice-infinispan:
                condition: service_started
            microservice-keycloak:
                condition: service_started
        ports:
            - "8082:8082"

volumes:
    postgres-data:

