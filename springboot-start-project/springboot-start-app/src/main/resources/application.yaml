server:
    port: 8081
    servlet:
        context-path: /
    compression:
        enabled: true
        mime-types: text/html,text/xml,text/plain,text/css, application/javascript, application/json

spring:
    application:
        name: springboot-start-project
        console:
            # TODO : by default (LIVE) false, in development and local developer true
            # enabled: false
            enabled: true
    main:
        banner-mode: "console"
        # banner-mode: off
    datasource:
        url: jdbc:h2:file:./target/local;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
        #url: jdbc:hsqldb:hsql://localhost:8877
        driverClassName: org.h2.Driver
        #driverClassName: org.postgresql.Driver
        #driverClassName: org.hsqldb.jdbc.JDBCDriver
        #driverClassName: org.apache.derby.jdbc.ClientDriver
        username: sa
        password:
        hikari:
            maximum-pool-size: 10
            minimum-idle: 5
            connection-timeout: 30000
            idle-timeout: 600000
            max-lifetime: 1800000
    h2:
        console:
            enabled: false
    liquibase:
        # With profiles in dev only
        contexts: load_example_data
        url: jdbc:h2:file:./target/local;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
        driver-class-name: org.h2.Driver
        #driver-class-name: org.postgresql.Driver
        #driver-class-name: org.hsqldb.jdbc.JDBCDriver
        #driver-class-name: org.apache.derby.jdbc.ClientDriver
        username: sa
        password:
    jpa:
        properties:
            hibernate:
                dialect: org.hibernate.dialect.H2Dialect
                #dialect: org.hibernate.dialect.PostgreSQLDialect
                #dialect: org.hibernate.dialect.HSQLDialect
                #dialect: org.hibernate.dialect.DerbyTenSevenDialect
                #dialect: org.hibernate.dialect.Oracle10gDialect
                id:
                    new_generator_mappings: false
                # TODO : by default false (LIVE) and developers true
                #format_sql: false
                format_sql: true
    graphql:
        graphiql:
            enabled: true
    quartz:
        job-store-type: jdbc
        jdbc:
            initialize-schema: always
        properties:
            org:
                quartz:
                    scheduler:
                        instanceName: ClusteredScheduler
                        instanceId: AUTO
                    threadPool:
                        class: org.quartz.simpl.SimpleThreadPool
                        threadCount: 25
                        threadPriority: 5
                    jobStore:
                        class: org.quartz.impl.jdbcjobstore.JobStoreTX
                        driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
                        #useProperties: false
                        tablePrefix: QRTZ_
                        isClustered: true
                        clusterCheckinInterval: 20000
                        dataSource: quartzDataSource
                    dataSource:
                        quartzDataSource:
                            driver: org.h2.Driver
                            URL: jdbc:h2:file:./target/local;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
                            user: sa
                            password:
    cache:
    security:
        oauth2:
            resourceserver:
                jwt:
                    # Token "iss" claim must be exactly this
                    issuer-uri: http://localhost:8180/iam/realms/example
                    # Signing keys, fetched lazily on first request, so startup does not need Keycloak
                    jwk-set-uri: http://localhost:8180/iam/realms/example/protocol/openid-connect/certs
                    # Token "aud" claim must contain this
                    audiences: springboot-start-app-api
#    jackson:
#        date-format: yyyy-MM-dd'T'HH:mm:ss:SSS'Z'
#        time-zone: UTC

management:
    endpoints:
        #        enabled-by-default: true
        web:
            exposure:
                include: health, info
    endpoint:
        info:
            enabled: true

springdoc:
    show-actuator: true
    api-docs:
        version: openapi_3_1
    enable-groovy: true

      #infinispan:
      #remote:
      #enabled: true
      #server-list: 127.0.0.1
      # application/x-protostream
      #marshaller: org.infinispan.commons.marshall.ProtoStreamMarshaller
      # application/x-jboss-marshalling
      #marshaller: org.infinispan.jboss.marshalling.commons.GenericJBossMarshaller
      # x-java-serialized-object
      #marhaller: org.infinispan.commons.marshall.JavaSerializationMarshaller
      #java-serial-allowlist: info.setmy.microservice.domain.*
    #auth-username: admin
    #auth-password: password

maven:
    project:
        groupId: @project.groupId@
        artifactId: @project.artifactId@

springBootStartProject:
    startup:
        timeZone: UTC
    example:
        foo: application.yaml
    security:
        keycloak:
            url: http://localhost:8180/iam
            realm: example
            issuerUrl: http://localhost:8180/iam/realms/example
            jwkSetUrl: http://localhost:8180/iam/realms/example/protocol/openid-connect/certs
            apiClientId: springboot-start-app-api
            audience: springboot-start-app-api
            spaClientId: springboot-start-app-spa
            principalClaim: preferred_username
    kubernetes:
        nodeNameSpace: ${POD_NAMESPACE}
        nodeName: ${NODE_NAME}
        podName: ${POD_NAME}

