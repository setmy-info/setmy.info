apiVersion: v1
kind: Secret
metadata:
    name: postgres-secrets-map
    namespace: microservice-local
data:
    # postgres: the superuser of the image only, as in docker-compose.yaml. Databases and users come from the init SQL
    # of postgres-init-config-map (src/main/docker/*.sql, generated by smi-postgresql-create-db-sql)
    postgres-user: cG9zdGdyZXM=
    postgres-password: ZzZwOA==
