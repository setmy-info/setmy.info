apiVersion: v1
kind: ConfigMap
metadata:
    name: keycloak-config-map
    namespace: microservice-local
data:
    # The URL of the browser, through keycloak-ingress: tokens carry iss http://keycloak.localhost/iam/realms/..., also when
    # the application pods talk to Keycloak as keycloak-service:8080
    kc-hostname: "http://keycloak.localhost/iam"
    # Database keycloak_local of keycloak-init.sql (smi-postgresql-create-db-sql keycloak local)
    kc-db-url: "jdbc:postgresql://postgres-service.microservice-local.svc.cluster.local:5432/keycloak_local"
