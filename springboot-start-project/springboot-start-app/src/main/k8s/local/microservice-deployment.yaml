apiVersion: apps/v1
kind: Deployment
metadata:
    name: microservice-deployment
    namespace: microservice-local
    labels:
        app: microservice-deployment
spec:
    # Two pods on the same database: Liquibase lock and clustered Quartz
    replicas: 2
    selector:
        matchLabels:
            app: microservice-deployment
    template:
        metadata:
            labels:
                app: microservice-deployment
        spec:
            # depends_on service_healthy of docker-compose.yaml
            initContainers:
                -   name: wait-for-postgres
                    image: postgis/postgis:18-3.6
                    command: [ "sh", "-c", "until pg_isready -h postgres-service -p 5432; do sleep 2; done" ]
            containers:
                -   name: microservice
                    # The image is imported into K3s (k3s ctr images import), not pulled
                    image: setmyinfo/springboot-start-app:latest
                    imagePullPolicy: Never
                    # The same start as the image CMD: the jar, log location and optional config file come from the
                    # MICROSERVICE_* of the Dockerfile, the profiles from MICROSERVICE_PROFILES below. Application
                    # arguments go to args, for example args: [ "--server.port=8082" ]
                    command: [ "smi-spring-boot" ]
                    ports:
                        -   name: ms-port
                            containerPort: 8082
                    env:
                        ## From config-map
                        -   name: MICROSERVICE_PROFILES
                            valueFrom:
                                configMapKeyRef:
                                    name: microservice-config-map
                                    key: microservice-profiles
                                    optional: false
                        -   name: INFINISPAN_SERVER_LIST
                            valueFrom:
                                configMapKeyRef:
                                    name: microservice-config-map
                                    key: infinispan-server-list
                                    optional: false
                        ## From the pod
                        -   name: POD_NAMESPACE
                            valueFrom:
                                fieldRef:
                                    fieldPath: metadata.namespace
                        -   name: POD_NAME
                            valueFrom:
                                fieldRef:
                                    fieldPath: metadata.name
                        -   name: NODE_NAME
                            valueFrom:
                                fieldRef:
                                    fieldPath: spec.nodeName
                        ## From secrets
                        -   name: SPRING_DATASOURCE_USERNAME
                            valueFrom:
                                secretKeyRef:
                                    name: microservice-secrets-map
                                    key: spring-datasource-username
                                    optional: false
                        -   name: SPRING_DATASOURCE_PASSWORD
                            valueFrom:
                                secretKeyRef:
                                    name: microservice-secrets-map
                                    key: spring-datasource-password
                                    optional: false
                        -   name: SPRING_LIQUIBASE_USER
                            valueFrom:
                                secretKeyRef:
                                    name: microservice-secrets-map
                                    key: spring-liquibase-user
                                    optional: false
                        -   name: SPRING_LIQUIBASE_PASSWORD
                            valueFrom:
                                secretKeyRef:
                                    name: microservice-secrets-map
                                    key: spring-liquibase-password
                                    optional: false
                        -   name: INFINISPAN_AUTH_USERNAME
                            valueFrom:
                                secretKeyRef:
                                    name: microservice-secrets-map
                                    key: infinispan-auth-username
                                    optional: false
                        -   name: INFINISPAN_AUTH_PASSWORD
                            valueFrom:
                                secretKeyRef:
                                    name: microservice-secrets-map
                                    key: infinispan-auth-password
                                    optional: false
                    # Public /actuator/health (SecurityConfiguration), the database included
                    startupProbe:
                        httpGet:
                            path: /actuator/health
                            port: ms-port
                        periodSeconds: 5
                        failureThreshold: 36
                    readinessProbe:
                        httpGet:
                            path: /actuator/health
                            port: ms-port
                        periodSeconds: 10
                    livenessProbe:
                        httpGet:
                            path: /actuator/health
                            port: ms-port
                        periodSeconds: 20
                        failureThreshold: 3
#                    volumeMounts:
#                        -   name: nfs-volume
#                            mountPath: /mnt/gintra
#            volumes:
#                -   name: nfs-volume
#                    persistentVolumeClaim:
#                        claimName: microservice-nfs-persistent-volume-claim
