apiVersion: apps/v1
kind: Deployment
metadata:
    name: microservice-deployment
    namespace: microservice-local
    labels:
        app: microservice-deployment
spec:
    #replicas: 3
    replicas: 2
    selector:
        matchLabels:
            app: microservice-deployment
    template:
        metadata:
            labels:
                app: microservice-deployment
        spec:
            containers:
                -   name: microservice
                    #image: docker.io/setmyinfo/springboot-start-app:latest
                    #image: library/springboot-start-app:latest
                    image: setmyinfo/springboot-start-app:latest
                    # The same start as the image CMD: the jar, log location and optional config file come from the
                    # MICROSERVICE_* of the Dockerfile, the profiles from MICROSERVICE_PROFILES below. Application
                    # arguments go to args, for example args: [ "--server.port=8082" ]
                    # The image is imported into K3s (k3s ctr images import), not pulled
                    command: [ "smi-spring-boot" ]
                    #args: [ "-jar", "/opt/setmy.info/lib/microservice.jar", "--spring.profiles.active=local" ]
                    imagePullPolicy: Never
                    ports:
                        -   name: ms-port
                            containerPort: 8082
                    env:
                        # smi-spring-boot: spring.profiles.active, instead of the live of the image
                        -   name: MICROSERVICE_PROFILES
                            value: "local"
                        ## From config-map
                        -   name: SPRING_DATASOURCE_URL
                            valueFrom:
                                configMapKeyRef:
                                    name: microservice-config-map
                                    key: spring-datasource-url
                                    optional: false
                        -   name: POD_NAMESPACE
                            valueFrom:
                                fieldRef:
                                    fieldPath: metadata.namespace
                        -   name: POD_NAME
                            valueFrom:
                                fieldRef:
                                    fieldPath: metadata.name
                        -   name: NODE_NAME
                            valueFrom:
                                fieldRef:
                                    fieldPath: spec.nodeName
                        -   name: INFINISPAN_SERVER_LIST
                            valueFrom:
                                configMapKeyRef:
                                    name: microservice-config-map
                                    key: infinispan-server-list
                                    optional: false
                        -   name: SMI_IAM_URL
                            valueFrom:
                                configMapKeyRef:
                                    name: microservice-config-map
                                    key: keycloak-url
                                    optional: false
                        -   name: SMI_IAM_REALM
                            valueFrom:
                                configMapKeyRef:
                                    name: microservice-config-map
                                    key: keycloak-realm
                                    optional: false
                        -   name: SMI_IAM_API_CLIENT_ID
                            valueFrom:
                                configMapKeyRef:
                                    name: microservice-config-map
                                    key: keycloak-api-client-id
                                    optional: false
                        -   name: SMI_IAM_SPA_CLIENT_ID
                            valueFrom:
                                configMapKeyRef:
                                    name: microservice-config-map
                                    key: keycloak-spa-client-id
                                    optional: false
                        ## From secrets
                        -   name: SPRING_DATASOURCE_USERNAME
                            valueFrom:
                                secretKeyRef:
                                    name: microservice-secrets-map
                                    key: spring-datasource-username
                                    optional: false
                        -   name: SPRING_DATASOURCE_PASSWORD
                            valueFrom:
                                secretKeyRef:
                                    name: microservice-secrets-map
                                    key: spring-datasource-password
                                    optional: false
                        -   name: INFINISPAN_AUTH_USERNAME
                            valueFrom:
                                secretKeyRef:
                                    name: microservice-secrets-map
                                    key: infinispan-auth-username
                                    optional: false
                        -   name: INFINISPAN_AUTH_PASSWORD
                            valueFrom:
                                secretKeyRef:
                                    name: microservice-secrets-map
                                    key: infinispan-auth-password
                                    optional: false
#                    volumeMounts:
#                        -   name: nfs-volume
#                            mountPath: /mnt/gintra
#            volumes:
#                -   name: nfs-volume
