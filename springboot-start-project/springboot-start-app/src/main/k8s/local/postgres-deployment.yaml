apiVersion: apps/v1
kind: Deployment
metadata:
    name: postgres-deployment
    namespace: microservice-local
spec:
    replicas: 1
    # One pod on the volume at a time: the old pod stops before the new one starts
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: postgres-deployment
    template:
        metadata:
            labels:
                app: postgres-deployment
        spec:
            containers:
                -   name: postgres
                    # PostgreSQL 18 with PostGIS 3.6, the same as docker-compose.yaml
                    image: postgis/postgis:18-3.6
                    ports:
                        -   name: pg-port
                            containerPort: 5432
                    env:
                        ## From secrets
                        -   name: POSTGRES_USER
                            valueFrom:
                                secretKeyRef:
                                    name: postgres-secrets-map
                                    key: postgres-user
                                    optional: false
                        -   name: POSTGRES_PASSWORD
                            valueFrom:
                                secretKeyRef:
                                    name: postgres-secrets-map
                                    key: postgres-password
                                    optional: false
                    readinessProbe:
                        exec:
                            command: [ "pg_isready", "-U", "postgres", "-d", "springboot_start_app_local" ]
                        periodSeconds: 5
                        timeoutSeconds: 5
                    volumeMounts:
                        # PostgreSQL 18 image: PGDATA is /var/lib/postgresql/18/docker
                        -   name: postgres-storage
                            mountPath: /var/lib/postgresql
                        # Run once on an empty volume, in alphabetical order: keycloak-init.sql, postgres-init.sql,
                        # postgres-postgis.sql
                        -   name: postgres-init
                            mountPath: /docker-entrypoint-initdb.d
                            readOnly: true
            volumes:
                -   name: postgres-storage
                    persistentVolumeClaim:
                        claimName: postgres-persistent-volume-claim
                # kubectl create configmap postgres-init-config-map --from-file=src/main/docker/..., see README.md
                -   name: postgres-init
                    configMap:
                        name: postgres-init-config-map
