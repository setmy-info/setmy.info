apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: microservice-ingress
    namespace: microservice-local
spec:
    # Traefik, the ingress controller K3s installs
    ingressClassName: traefik
    rules:
        -   host: microservice-local
            http:
                paths:
                    -   path: /
                        pathType: Prefix
                        backend:
                            service:
                                name: microservice-service
                                port:
                                    number: 80
