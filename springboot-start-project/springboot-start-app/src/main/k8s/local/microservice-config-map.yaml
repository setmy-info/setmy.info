apiVersion: v1
kind: ConfigMap
metadata:
    name: microservice-config-map
    namespace: microservice-local
    # <service-name>.<namespace>.svc.cluster.local
    # <pod-name>.<service-name>.<namespace>.svc.cluster.local
    # postgresql-1.postgres-service.microservice-local.svc.cluster.local
data:
    # smi-spring-boot: spring.profiles.active. local and k8s (application-k8s.yml: Postgres, Keycloak of this namespace),
    # the same way as local,compose of docker-compose.yaml
    microservice-profiles: "local,k8s"
    # Not used yet: the application has embedded Infinispan
    infinispan-server-list: "infinispan-service.microservice-local.svc.cluster.local:11222"
